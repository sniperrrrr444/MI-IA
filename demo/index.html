<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MI-IA · Demo</title><style>*{box-sizing:border-box}body{margin:0;background:#080a0f;color:#f5f7fa;font:15px system-ui;display:grid;place-items:center;min-height:100vh}.app{width:min(760px,94vw);height:min(820px,94vh);display:flex;flex-direction:column;background:#10141d;border:1px solid #29303d;border-radius:22px;overflow:hidden;box-shadow:0 20px 60px #0008}header{padding:18px 20px;border-bottom:1px solid #29303d;display:flex;justify-content:space-between}.logo{font-size:22px;font-weight:800}.state{font-size:12px;opacity:.7}#chat{flex:1;overflow:auto;padding:20px}.m{max-width:80%;padding:12px 15px;margin:10px 0;border-radius:16px;white-space:pre-wrap;line-height:1.45}.u{margin-left:auto;background:#28334b}.a{background:#181e29;border:1px solid #29303d}form{display:flex;gap:8px;padding:12px;border-top:1px solid #29303d}input{flex:1;background:#171c25;color:inherit;border:1px solid #303747;border-radius:13px;padding:13px;outline:none}button{border:0;border-radius:13px;padding:0 18px;font-weight:700;cursor:pointer}</style></head><body><main class="app"><header><div class="logo">MI-IA</div><div class="state">DEMO · LOCAL ENGINE</div></header><section id="chat"><div class="m a">Hola. Soy la interfaz de prueba de MI-IA. Conecta el Engine local para obtener respuestas reales.</div></section><form id="form"><input id="input" placeholder="Escribe un mensaje…" autocomplete="off"><button>Enviar</button></form></main><script>const API=location.hostname==='127.0.0.1'||location.hostname==='localhost'?'http://127.0.0.1:8000/api/chat':null;const chat=document.querySelector('#chat'),input=document.querySelector('#input');function add(c,t){const e=document.createElement('div');e.className='m '+c;e.textContent=t;chat.append(e);chat.scrollTop=chat.scrollHeight}document.querySelector('#form').onsubmit=async e=>{e.preventDefault();const q=input.value.trim();if(!q)return;add('u',q);input.value='';if(!API){add('a','Esta demo estática necesita que MI-IA Engine esté ejecutándose localmente.');return}try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:q,history:[]})});const d=await r.json();add('a',d.response||d.detail||'Sin respuesta')}catch(err){add('a','No se pudo conectar con el Engine local.')}};</script></body></html>
