<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="MI-IA — asistente de inteligencia artificial local"><title>MI-IA — IA local</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#080a0f;color:#f4f6fb;font:16px system-ui,-apple-system,sans-serif;display:grid;place-items:center}.wrap{width:min(900px,94vw);padding:30px}.hero{text-align:center;margin-bottom:28px}.hero h1{font-size:clamp(40px,9vw,72px);margin:0;letter-spacing:-3px}.hero p{opacity:.65}.card{background:#11151e;border:1px solid #29303d;border-radius:24px;padding:20px}.chat{height:420px;overflow:auto}.m{max-width:78%;padding:13px 16px;border-radius:18px;margin:12px 0;white-space:pre-wrap;line-height:1.5}.a{border:1px solid #29303d;background:#181e29}.u{margin-left:auto;background:#28334b}form{display:flex;gap:10px;margin-top:12px}input{flex:1;min-width:0;background:#171c25;color:inherit;border:1px solid #303747;border-radius:14px;padding:15px;font-size:16px}button{border:0;border-radius:14px;padding:0 22px;font-weight:800;cursor:pointer}.status{font-size:12px;opacity:.55;margin-top:10px}</style></head><body><div class="wrap"><section class="hero"><h1>MI-IA</h1><p>Inteligencia artificial local, privada y optimizada.</p></section><main class="card"><div id="chat" class="chat"><div class="m a">Bienvenido a MI-IA. Esta es la demo pública del proyecto.</div></div><form id="form"><input id="input" placeholder="Pregunta algo…" autocomplete="off"><button>Enviar</button></form><div id="status" class="status">Demo web · El motor completo funciona localmente.</div></main></div><script>const chat=document.querySelector('#chat'),input=document.querySelector('#input'),status=document.querySelector('#status');function add(c,t){let e=document.createElement('div');e.className='m '+c;e.textContent=t;chat.append(e);chat.scrollTop=chat.scrollHeight}document.querySelector('#form').onsubmit=e=>{e.preventDefault();let q=input.value.trim();if(!q)return;add('u',q);input.value='';add('a','La demo pública es una interfaz de presentación. Para generar respuestas con el modelo real, ejecuta el MI-IA Engine local.');status.textContent='Modo demo · sin envío de conversaciones a un servidor público.'}</script></body></html>
