<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0d12"><link rel="manifest" href="manifest.json"><title>MI-IA</title><style>
:root{font-family:system-ui,sans-serif;color:#f4f5f7;background:#0b0d12}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#171b28,#0b0d12 55%)}.app{width:min(980px,100%);margin:auto;min-height:100vh;padding:16px;display:flex;flex-direction:column}header{display:flex;justify-content:space-between;align-items:center;padding:8px 2px 14px}.brand{font-size:25px;font-weight:850}.badge{border:1px solid #303645;border-radius:99px;padding:5px 9px;font-size:11px;letter-spacing:.08em}.actions{display:flex;gap:7px}.small{background:#151a24;color:inherit;border:1px solid #303645;border-radius:11px;padding:8px 10px;cursor:pointer}#status{font-size:13px;opacity:.65;margin-bottom:8px}#chat{flex:1;min-height:60vh;overflow:auto;padding:6px 0 90px}.msg{max-width:82%;padding:13px 15px;margin:11px 0;border-radius:17px;white-space:pre-wrap;line-height:1.5;overflow-wrap:anywhere}.user{margin-left:auto;background:#29334d}.assistant{background:#171c27;border:1px solid #282e3c}form{position:sticky;bottom:6px;display:flex;gap:8px;padding:9px;background:#11151eeb;border:1px solid #2a3040;border-radius:17px;backdrop-filter:blur(12px)}input,textarea{min-width:0;background:transparent;border:0;outline:0;color:inherit;font:inherit}form input{flex:1;padding:10px}button.send{border:0;border-radius:12px;padding:0 18px;font-weight:700;cursor:pointer}.panel{display:none;position:fixed;inset:0;background:#080a0fdd;backdrop-filter:blur(8px);padding:20px;z-index:5}.card{width:min(620px,100%);max-height:90vh;overflow:auto;margin:auto;background:#121722;border:1px solid #303645;border-radius:18px;padding:18px}.card h2{margin-top:0}.card textarea{width:100%;min-height:100px;border:1px solid #303645;border-radius:12px;padding:10px;margin:8px 0}.card button{padding:10px 12px;border:1px solid #303645;border-radius:10px;background:#1b2230;color:inherit;cursor:pointer}.row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}@media(max-width:600px){.app{padding:11px}.msg{max-width:92%}}</style></head><body><div class="app"><header><div class="brand">MI-IA</div><div class="actions"><button class="small" id="brain">Cerebro</button><button class="small" id="clear">Nueva</button><span class="badge">LOCAL</span></div></header><div id="status">Comprobando motor local…</div><section id="chat"></section><form id="form"><input id="input" autocomplete="off" placeholder="Habla con MI-IA…"><button class="send" id="send">Enviar</button></form></div>
<div class="panel" id="panel"><div class="card"><h2>Cerebro de MI-IA</h2><p>Todo lo añadido aquí se guarda localmente. La zona de entrenamiento crea ejemplos para futuras etapas de ajuste del modelo; no modifica silenciosamente los pesos de la IA.</p><h3>Memoria</h3><textarea id="mem" placeholder="Ejemplo: Mi proyecto se llama MI-IA."></textarea><div class="row"><button id="saveMem">Guardar memoria</button><button id="wipeMem">Borrar memoria</button></div><h3>Entrenamiento</h3><textarea id="inst" placeholder="Instrucción / pregunta"></textarea><textarea id="resp" placeholder="Respuesta ideal de MI-IA"></textarea><button id="train">Guardar ejemplo</button><p id="count"></p><div class="row"><button id="close">Cerrar</button></div></div></div>
<script>
const API="http://127.0.0.1:8000",chat=document.querySelector("#chat"),input=document.querySelector("#input"),form=document.querySelector("#form"),send=document.querySelector("#send"),status=document.querySelector("#status"),panel=document.querySelector("#panel");let history=JSON.parse(localStorage.getItem("miia-history")||"[]");
function add(role,text){let e=document.createElement("div");e.className="msg "+role;e.textContent=text;chat.appendChild(e);chat.scrollTop=chat.scrollHeight}
function render(){chat.innerHTML="";history.forEach(m=>add(m.role,m.content))}
async function health(){try{let d=await (await fetch(API+"/api/health")).json();status.textContent=d.local_engine?"Motor local conectado · "+d.model:"Motor local no disponible";}catch{status.textContent="Backend local no disponible"}}
form.onsubmit=async e=>{e.preventDefault();let message=input.value.trim();if(!message)return;history.push({role:"user",content:message});add("user",message);input.value="";send.disabled=true;add("assistant","Pensando…");let thinking=chat.lastChild;try{let r=await fetch(API+"/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message,history:history.slice(0,-1)})});let d=await r.json();if(!r.ok)throw Error(d.detail||"Error");thinking.textContent=d.response;history.push({role:"assistant",content:d.response});localStorage.setItem("miia-history",JSON.stringify(history))}catch(err){thinking.textContent="Error local: "+err.message}finally{send.disabled=false;input.focus()}}
document.querySelector("#clear").onclick=()=>{history=[];localStorage.removeItem("miia-history");render()};document.querySelector("#brain").onclick=()=>panel.style.display="flex";document.querySelector("#close").onclick=()=>panel.style.display="none";
document.querySelector("#saveMem").onclick=async()=>{let text=document.querySelector("#mem").value.trim();if(!text)return;await fetch(API+"/api/memory",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text})});document.querySelector("#mem").value=""};
document.querySelector("#wipeMem").onclick=async()=>{if(confirm("¿Borrar toda la memoria local?"))await fetch(API+"/api/memory",{method:"DELETE"})};
document.querySelector("#train").onclick=async()=>{let instruction=document.querySelector("#inst").value.trim(),response=document.querySelector("#resp").value.trim();if(!instruction||!response)return;let r=await fetch(API+"/api/train",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({instruction,response})});let d=await r.json();document.querySelector("#count").textContent="Ejemplos guardados: "+(d.training_examples??"?");document.querySelector("#inst").value="";document.querySelector("#resp").value=""};
render();health();if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
