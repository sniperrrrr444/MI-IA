<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0d12">
<link rel="manifest" href="manifest.json">
<title>MI-IA</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;color:#f4f5f7;background:#0b0d12}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#171b28,#0b0d12 55%)}
.app{width:min(920px,100%);margin:auto;min-height:100vh;display:flex;flex-direction:column;padding:18px}
header{display:flex;align-items:center;justify-content:space-between;padding:8px 2px 18px}
.brand{font-weight:800;font-size:24px}.badge{font-size:12px;opacity:.7;border:1px solid #303645;padding:6px 9px;border-radius:99px}
#status{font-size:13px;opacity:.7;margin-bottom:10px}
#chat{flex:1;min-height:62vh;overflow:auto;padding:8px 0 90px}
.msg{max-width:82%;padding:13px 15px;margin:12px 0;border-radius:17px;white-space:pre-wrap;line-height:1.5;overflow-wrap:anywhere}
.user{margin-left:auto;background:#29334d}.assistant{background:#171c27;border:1px solid #282e3c}
form{position:sticky;bottom:12px;display:flex;gap:9px;padding:10px;background:#11151eeb;border:1px solid #2a3040;border-radius:18px;backdrop-filter:blur(12px)}
input{min-width:0;flex:1;background:transparent;border:0;outline:0;color:inherit;font-size:16px;padding:10px}
button{border:0;border-radius:13px;padding:0 18px;font-weight:700;cursor:pointer}
button:disabled{opacity:.5}
.actions{display:flex;gap:8px}.small{background:transparent;color:inherit;border:1px solid #303645;padding:7px 10px}
@media(max-width:600px){.app{padding:12px}.msg{max-width:92%}form{bottom:6px}}
</style>
</head>
<body><div class="app">
<header><div class="brand">MI-IA</div><div class="actions"><button class="small" id="clear">Nueva</button><span class="badge">LOCAL</span></div></header>
<div id="status">Comprobando motor local…</div>
<section id="chat"></section>
<form id="form"><input id="input" autocomplete="off" placeholder="Habla con MI-IA…" aria-label="Mensaje"><button id="send">Enviar</button></form>
</div>
<script>
const API="http://127.0.0.1:8000", chat=document.querySelector("#chat"),input=document.querySelector("#input"),form=document.querySelector("#form"),send=document.querySelector("#send"),status=document.querySelector("#status");
let history=JSON.parse(localStorage.getItem("miia-history")||"[]");
function render(){chat.innerHTML="";history.forEach(m=>add(m.role,m.content,false));}
function add(role,text,save=true){const el=document.createElement("div");el.className="msg "+role;el.textContent=text;chat.appendChild(el);chat.scrollTop=chat.scrollHeight;if(save){localStorage.setItem("miia-history",JSON.stringify(history));}}
async function health(){try{const r=await fetch(API+"/api/health");const d=await r.json();status.textContent=d.local_engine?"Motor local conectado · "+d.model:"Motor local no disponible · inicia Ollama";}catch{status.textContent="Backend local no disponible · ejecuta MI-IA";}}
form.addEventListener("submit",async e=>{e.preventDefault();const message=input.value.trim();if(!message)return;history.push({role:"user",content:message});add("user",message);input.value="";send.disabled=true;add("assistant","Pensando…",false);const thinking=chat.lastChild;try{const r=await fetch(API+"/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message,history:history.slice(0,-1)})});const d=await r.json();if(!r.ok)throw Error(d.detail||"Error");thinking.textContent=d.response;history.push({role:"assistant",content:d.response});localStorage.setItem("miia-history",JSON.stringify(history));}catch(err){thinking.textContent="No puedo conectar con la IA local. "+err.message;}finally{send.disabled=false;input.focus();}});
document.querySelector("#clear").onclick=()=>{history=[];localStorage.removeItem("miia-history");render();};
render();health();if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
